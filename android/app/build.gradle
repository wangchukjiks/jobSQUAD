plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jobsquad.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jobsquad.app"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            storeFile file("jobsquad-release.jks")
            storePassword "jobsquad2026"
            keyAlias "jobsquad"
            keyPassword "jobsquad2026"
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
